<text x="32" y="90" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Smart Model Router</text><text x="32" y="128" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">Routes every AI coding task to the cheapest model that</text><text x="32" y="153" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">can reliably do it, verifies the result, and escalates</text><text x="32" y="178" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">only on failure.</text><rect x="32" y="212" width="116" height="28" rx="14" fill="#ffd27a" fill-opacity=".1" stroke="#ffd27a" stroke-opacity=".45"/><text x="90" y="231" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Claude Code</text><rect x="158.2" y="212" width="67" height="28" rx="14" fill="#ffd27a" fill-opacity=".1" stroke="#ffd27a" stroke-opacity=".45"/><text x="192" y="231" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Codex</text><rect x="235.2" y="212" width="75" height="28" rx="14" fill="#ffd27a" fill-opacity=".1" stroke="#ffd27a" stroke-opacity=".45"/><text x="273" y="231" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Cursor</text><rect x="320.4" y="212" width="51" height="28" rx="14" fill="#ffd27a" fill-opacity=".1" stroke="#ffd27a" stroke-opacity=".45"/><text x="346" y="231" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">MCP</text>
