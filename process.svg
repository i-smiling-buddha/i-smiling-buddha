<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="How I build: notice, build, verify, share"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17132e"/><stop offset="1" stop-color="#34258f"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2994a"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.38"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs>
<style>.dash{stroke-dasharray:6 8;animation:mv 2.4s linear infinite}@keyframes mv{to{stroke-dashoffset:-28}}@media (prefers-reduced-motion:reduce){.dash{animation:none}}</style>
<rect width="1200" height="176" rx="16" fill="url(#bg)"/><rect x=".5" y=".5" width="1199" height="175" rx="16" fill="none" stroke="#ffd27a" stroke-opacity=".28"/>
<path class="dash" d="M176 58 H1024" stroke="#ffd27a" stroke-opacity=".55" stroke-width="2"/><circle cx="150" cy="58" r="26" fill="#201840" stroke="url(#gold)" stroke-width="2.5"/><text x="150" y="64" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="150" y="116" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">NOTICE</text><text x="150" y="142" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">A real problem I hit myself</text><circle cx="450" cy="58" r="26" fill="#201840" stroke="url(#gold)" stroke-width="2.5"/><text x="450" y="64" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="450" y="116" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">BUILD</text><text x="450" y="142" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">The smallest tool that solves it</text><circle cx="750" cy="58" r="26" fill="#201840" stroke="url(#gold)" stroke-width="2.5"/><text x="750" y="64" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="750" y="116" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">VERIFY</text><text x="750" y="142" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">Run it, test it, try to break it</text><circle cx="1050" cy="58" r="26" fill="#201840" stroke="url(#gold)" stroke-width="2.5"/><text x="1050" y="64" fill="#ffd27a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">04</text><text x="1050" y="116" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">SHARE</text><text x="1050" y="142" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">Free, documented, open to change</text></svg>