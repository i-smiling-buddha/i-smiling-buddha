<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Smiling Buddha. Free, open-source AI tools, built quietly in India.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17132e"/><stop offset="1" stop-color="#34258f"/></linearGradient>
