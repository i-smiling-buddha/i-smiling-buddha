.halo{animation:pulse 6s ease-in-out infinite;transform-origin:1010px 185px}@keyframes pulse{50%{transform:scale(1.18);opacity:.75}}
.lotus{animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}
.tg{opacity:0;animation:rot 15s infinite}.t1{animation-delay:5s}.t2{animation-delay:10s}
