<text class="tg t0" x="64" y="218" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Free, open-source AI tools. Built quietly in India.</text><text class="tg t1" x="64" y="218" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Building Bharat&#39;s digital future, together.</text><text class="tg t2" x="64" y="218" fill="#d9d4ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">The work gets the spotlight. I stay behind it.</text>
